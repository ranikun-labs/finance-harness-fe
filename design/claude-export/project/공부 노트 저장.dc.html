<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E9EBEE}
  ::selection{background:#3182F6;color:#fff}
  .scr::-webkit-scrollbar{display:none}
  input,textarea{outline:none;resize:none;font-family:Pretendard,-apple-system,sans-serif}
</style>
</helmet>

<div style="font-family:Pretendard,-apple-system,sans-serif;background:#E9EBEE;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased">

  <div style="width:393px;height:830px;background:#000;border-radius:54px;padding:11px;box-shadow:0 40px 80px -20px rgba(20,30,50,0.4),0 0 0 1px rgba(0,0,0,0.05)">
    <div style="position:relative;width:100%;height:100%;background:#F2F4F6;border-radius:44px;overflow:hidden;display:flex;flex-direction:column">

      <!-- status bar -->
      <div style="position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 32px;pointer-events:none">
        <span style="font-size:15px;font-weight:600;color:#191F28">9:41</span>
        <div style="display:flex;align-items:center;gap:6px"><span style="font-size:13px">📶</span><span style="font-size:13px">🔋</span></div>
      </div>
      <!-- notch -->
      <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:18px;z-index:30"></div>

      <!-- nav bar -->
      <div style="position:absolute;top:46px;left:0;right:0;height:52px;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(242,244,246,0.92);backdrop-filter:blur(12px)">
        <div style="width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid #ECEFF2;display:flex;align-items:center;justify-content:center;font-size:18px;color:#4E5968;cursor:pointer" style-hover="background:#F2F4F6">←</div>
        <span style="font-size:15px;font-weight:700;color:#191F28">기록 저장</span>
        <div style="width:38px"></div>
      </div>

      <!-- SCROLL CONTENT -->
      <div class="scr" style="flex:1;overflow-y:auto;padding:108px 20px 24px;display:flex;flex-direction:column;gap:18px">

        <!-- 1. 토글: 공부 노트 선택 상태 -->
        <div style="background:#E5E8EB;border-radius:16px;padding:4px;display:flex;gap:4px">
          <button style="flex:1;height:42px;border:none;border-radius:13px;background:transparent;color:#8B95A1;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">투자 기록</button>
          <button style="flex:1;height:42px;border:none;border-radius:13px;background:#fff;color:#191F28;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,50,0.1)">공부 노트</button>
        </div>

        <!-- 2. 주제 -->
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="font-size:13px;font-weight:600;color:#4E5968">주제</label>
          <div style="background:#fff;border:1.5px solid #E5E8EB;border-radius:14px;padding:0 16px;height:50px;display:flex;align-items:center">
            <input type="text" placeholder="배운 주제나 개념을 적어보세요." value="월말 리밸런싱" style="flex:1;border:none;background:transparent;font-size:16px;font-weight:500;color:#191F28" />
          </div>
        </div>

        <!-- 3. 원래 질문 (읽기 전용) -->
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="font-size:13px;font-weight:600;color:#4E5968">원래 질문</label>
          <div style="background:#F9FAFB;border:1px solid #ECEFF2;border-radius:14px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start">
            <div style="width:3px;align-self:stretch;border-radius:2px;background:#8B95A1;flex-shrink:0"></div>
            <span style="font-size:16px;font-weight:500;color:#6B7684;line-height:1.5;font-style:italic">월말·분기말에 기관은 왜 리밸런싱하나?</span>
          </div>
        </div>

        <!-- 4. 오늘 배운 것 -->
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="font-size:13px;font-weight:600;color:#4E5968">오늘 배운 것</label>
          <div style="background:#fff;border:1.5px solid #E5E8EB;border-radius:14px;padding:16px">
            <textarea placeholder="이번에 새로 이해한 내용을 적어보세요." style="width:100%;height:100px;border:none;background:transparent;font-size:15px;color:#191F28;line-height:1.65">펀드 벤치마크 대비 비중 조정이 필요해 월말에 기관 수급이 크게 튀는 경향이 있다. 단기 수급 왜곡으로 오해하기 쉬우니 월말에는 수급 해석을 보수적으로 해야겠다.</textarea>
          </div>
        </div>

        <!-- 5. 다음에 확인할 것 -->
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="font-size:13px;font-weight:600;color:#4E5968">다음에 확인할 것</label>
          <div style="background:#fff;border-radius:16px;overflow:hidden;border:1px solid #ECEFF2">

            <div style="padding:15px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F2F4F6;cursor:pointer" style-hover="background:#F9FAFB">
              <div style="width:22px;height:22px;border-radius:7px;background:#EBF3FE;border:1.5px solid #3182F6;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#3182F6;font-size:12px;font-weight:700">✓</div>
              <span style="font-size:15px;color:#191F28">외국인 수급</span>
            </div>

            <div style="padding:15px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F2F4F6;cursor:pointer" style-hover="background:#F9FAFB">
              <div style="width:22px;height:22px;border-radius:7px;background:#F2F4F6;border:1.5px solid #E5E8EB;flex-shrink:0"></div>
              <span style="font-size:15px;color:#6B7684">기관 수급</span>
            </div>

            <div style="padding:15px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F2F4F6;cursor:pointer" style-hover="background:#F9FAFB">
              <div style="width:22px;height:22px;border-radius:7px;background:#F2F4F6;border:1.5px solid #E5E8EB;flex-shrink:0"></div>
              <span style="font-size:15px;color:#6B7684">실적 발표 일정</span>
            </div>

            <div style="padding:15px 16px;display:flex;align-items:center;gap:12px;cursor:pointer" style-hover="background:#F9FAFB">
              <div style="width:22px;height:22px;border-radius:7px;background:#F2F4F6;border:1.5px solid #E5E8EB;flex-shrink:0"></div>
              <span style="font-size:15px;color:#6B7684">환율 / 금리</span>
            </div>

          </div>

          <!-- 항목 추가 -->
          <button style="width:100%;height:44px;border:1.5px dashed #D4D9DF;border-radius:14px;background:transparent;color:#8B95A1;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px" style-hover="border-color:#3182F6;color:#3182F6">+ 항목 추가</button>
        </div>

        <!-- 6. 저장 버튼 -->
        <button style="width:100%;height:54px;border:none;border-radius:16px;background:#3182F6;color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:-0.01em;box-shadow:0 6px 18px -4px rgba(49,130,246,0.4)" style-hover="background:#1B64DA">저장하기</button>

      </div>

      <!-- TAB BAR -->
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);border-top:1px solid #ECEFF2;padding:10px 0 26px;display:flex;justify-content:space-around;z-index:20">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#B0B8C1;cursor:pointer"><span style="font-size:21px;line-height:1">○</span><span style="font-size:11px;font-weight:600">홈</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#B0B8C1;cursor:pointer"><span style="font-size:21px;line-height:1">✦</span><span style="font-size:11px;font-weight:600">질문</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#3182F6;cursor:pointer"><span style="font-size:21px;line-height:1">▤</span><span style="font-size:11px;font-weight:700">기록</span></div>
      </div>

      <!-- home indicator -->
      <div style="position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#191F28;opacity:0.85;z-index:25"></div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
