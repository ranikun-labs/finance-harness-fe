<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E9EBEE}
  ::selection{background:#3182F6;color:#fff}
  .scr::-webkit-scrollbar{display:none}
</style>
</helmet>

<div style="font-family:Pretendard,-apple-system,sans-serif;background:#E9EBEE;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;-webkit-font-smoothing:antialiased">

  <div style="width:393px;height:830px;background:#000;border-radius:54px;padding:11px;box-shadow:0 40px 80px -20px rgba(20,30,50,0.4),0 0 0 1px rgba(0,0,0,0.05)">
    <div style="position:relative;width:100%;height:100%;background:#F2F4F6;border-radius:44px;overflow:hidden;display:flex;flex-direction:column">

      <!-- status bar -->
      <div style="position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 32px;pointer-events:none">
        <span style="font-size:15px;font-weight:600;color:#191F28">9:41</span>
        <div style="display:flex;align-items:center;gap:6px"><span style="font-size:13px">📶</span><span style="font-size:13px">🔋</span></div>
      </div>
      <!-- notch -->
      <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:18px;z-index:30"></div>

      <!-- CONTENT -->
      <div class="scr" style="flex:1;overflow-y:auto;padding:62px 20px 100px;display:flex;flex-direction:column;gap:16px">

        <!-- 헤더 -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 2px 4px">
          <h1 style="font-size:27px;font-weight:800;letter-spacing:-0.03em;color:#191F28">기록</h1>
          <div style="width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid #ECEFF2;display:flex;align-items:center;justify-content:center;font-size:18px;color:#D4D9DF">🔍</div>
        </div>

        <!-- 타입 필터 -->
        <div style="display:flex;gap:8px;padding:0 2px">
          <button style="height:36px;padding:0 16px;border:none;border-radius:11px;background:#E5E8EB;color:#B0B8C1;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap">전체</button>
          <button style="height:36px;padding:0 16px;border:1px solid #ECEFF2;border-radius:11px;background:#F9FAFB;color:#C0C6CE;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap">투자 기록</button>
          <button style="height:36px;padding:0 16px;border:1px solid #ECEFF2;border-radius:11px;background:#F9FAFB;color:#C0C6CE;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap">공부 노트</button>
        </div>

        <!-- EMPTY STATE -->
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px 32px;gap:28px">

          <!-- 일러스트 영역 -->
          <div style="position:relative;width:140px;height:140px">
            <!-- 배경 원 -->
            <div style="position:absolute;inset:0;border-radius:50%;background:linear-gradient(145deg,#EBF3FE,#F2F4F6)"></div>
            <!-- 노트 -->
            <div style="position:absolute;top:22px;left:28px;width:60px;height:76px;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(49,130,246,0.12);display:flex;flex-direction:column;gap:0;overflow:hidden">
              <div style="height:28px;background:#3182F6;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center">
                <div style="width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,0.7)"></div>
              </div>
              <div style="padding:10px 8px;display:flex;flex-direction:column;gap:6px">
                <div style="height:3px;border-radius:2px;background:#E5E8EB"></div>
                <div style="height:3px;border-radius:2px;background:#E5E8EB;width:70%"></div>
                <div style="height:3px;border-radius:2px;background:#E5E8EB"></div>
              </div>
            </div>
            <!-- 체크 뱃지 -->
            <div style="position:absolute;bottom:18px;right:18px;width:42px;height:42px;border-radius:50%;background:#3182F6;box-shadow:0 4px 12px rgba(49,130,246,0.35);display:flex;align-items:center;justify-content:center">
              <span style="color:#fff;font-size:20px;font-weight:800;line-height:1">✓</span>
            </div>
            <!-- 작은 점 장식 -->
            <div style="position:absolute;top:14px;right:22px;width:8px;height:8px;border-radius:50%;background:#C9E0FC"></div>
            <div style="position:absolute;bottom:28px;left:14px;width:6px;height:6px;border-radius:50%;background:#DCE7FB"></div>
          </div>

          <!-- 텍스트 -->
          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
            <span style="font-size:20px;font-weight:700;color:#191F28;letter-spacing:-0.02em">아직 저장된 기록이 없어요</span>
            <span style="font-size:15px;color:#8B95A1;line-height:1.65;max-width:260px">질문을 체크리스트로 바꾸고<br/>첫 기록을 남겨보세요.</span>
          </div>

          <!-- CTA -->
          <button style="height:52px;padding:0 32px;border:none;border-radius:16px;background:#3182F6;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:-0.01em;box-shadow:0 6px 18px -4px rgba(49,130,246,0.4);display:flex;align-items:center;gap:8px" style-hover="background:#1B64DA">
            <span>✦</span><span>질문하러 가기</span>
          </button>

          <!-- 힌트 -->
          <span style="font-size:13px;color:#C0C6CE;text-align:center;line-height:1.6">질문 하나가 체크리스트가 되고,<br/>체크리스트가 나만의 기록이 돼요.</span>
        </div>

      </div>

      <!-- TAB BAR -->
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);border-top:1px solid #ECEFF2;padding:10px 0 26px;display:flex;justify-content:space-around;z-index:20">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#B0B8C1;cursor:pointer"><span style="font-size:21px;line-height:1">○</span><span style="font-size:11px;font-weight:600">홈</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#B0B8C1;cursor:pointer"><span style="font-size:21px;line-height:1">✦</span><span style="font-size:11px;font-weight:600">질문</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#3182F6;cursor:pointer"><span style="font-size:21px;line-height:1">▤</span><span style="font-size:11px;font-weight:700">기록</span></div>
      </div>

      <!-- home indicator -->
      <div style="position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#191F28;opacity:0.85;z-index:25"></div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
