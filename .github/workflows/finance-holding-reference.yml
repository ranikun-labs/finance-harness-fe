name: Finance holding reference FE
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/finance-holding-reference.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - src/app/AppRouter.tsx
      - src/features/auth/**
      - src/features/holding/**
      - src/i18n/**
      - src/pages/HomePage.tsx

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit
      - run: >-
          pnpm exec vitest run src/features/auth/financeReferenceAuth.test.ts
          src/features/holding/ReferenceHolding.test.tsx src/app/AppRouter.test.tsx
          src/pages/HomePage.test.tsx src/i18n/dictionary.test.ts
