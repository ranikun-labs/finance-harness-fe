name: DEV browser e2e

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      # 액션은 커밋 SHA로 고정한다(주석에 태그). 실제 BE가 필요한 journal-backend.integration은 제외한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # 메인 e2e의 webServer는 dist를 preview한다. 빌드 산출물이 현재 HEAD와 같아야 한다.
      - name: Build
        run: pnpm run build
      - name: Main e2e (Desktop Chromium + Mobile 375)
        run: |
          set -euo pipefail
          SPECS=$(find e2e -name '*.spec.ts' ! -name 'journal-backend.integration.spec.ts' | sort)
          pnpm exec playwright test --reporter=line,html --trace retain-on-failure $SPECS
      - name: Editor and flow harness e2e
        if: ${{ !cancelled() }}
        run: pnpm run test:e2e:editor
      - name: Dialog harness e2e
        if: ${{ !cancelled() }}
        run: pnpm run test:e2e:dialog
      - name: Upload Playwright report and traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
