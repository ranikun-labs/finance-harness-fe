name: RPL-34 Journal Create CI (Finance BE PR #12)

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/rpl34-journal-create-be12.yml
      - .node-version
      - .nvmrc
      - e2e/journal-backend.integration.spec.ts
      - e2e/support/**
      - package.json
      - playwright.backend-integration.config.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - src/**
      - tsconfig*.json
      - vite.config.ts

permissions:
  contents: read

jobs:
  verify-against-finance-be-pr12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPECTED_FE_SOURCE_SHA: 42807f2eaf042e60f5b2a4bef3c6607d7e344d6a
      FINANCE_BE_SOURCE_SHA: 773f9c2fd09c54bd7fa3db692eed74466b5e4bf4
      FINANCE_BE_TREE_SHA: 27e5c2089d3dd31bc1065a8dbb93be7c9a97818d
      PLATFORM_SHARED_AI_SOURCE_SHA: 0f300e6ee4958bc62cd7e48e07bb39264aa06dea
      PLATFORM_VALIDATION_WORKFLOW_SHA: 0949fc7802b5e4d44973a4c70ac1c3a8b921f83f
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: finance_ci_ephemeral
          POSTGRES_DB: finance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ci -d finance_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Assert FE and compatibility source pins
        env:
          EVENT_FE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EVENT_FE_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FE_SOURCE_SHA"
          printf 'FE product source: %s\n' "$EXPECTED_FE_SOURCE_SHA"
          printf 'Finance BE source: %s (tree %s)\n' "$FINANCE_BE_SOURCE_SHA" "$FINANCE_BE_TREE_SHA"
          printf 'Platform Shared AI source reference: %s\n' "$PLATFORM_SHARED_AI_SOURCE_SHA"
          printf 'Existing Platform validation workflow: %s (Actions #41374401597)\n' "$PLATFORM_VALIDATION_WORKFLOW_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic Journal Create tests
        run: >-
          pnpm exec vitest run
          src/app/JournalCreateFlow.integration.test.tsx
          src/features/journal-new
          src/test/journal/DeterministicJournalCreatePort.test.ts
          src/pages/JournalNewPage.test.tsx

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check out pinned Finance BE PR #12
        uses: actions/checkout@v4
        with:
          repository: ranikun-labs/finance-harness-be
          ref: 773f9c2fd09c54bd7fa3db692eed74466b5e4bf4
          path: finance-harness-be
          persist-credentials: false

      - name: Assert pinned Finance BE source
        run: |
          test "$(git -C finance-harness-be rev-parse HEAD)" = "$FINANCE_BE_SOURCE_SHA"
          test "$(git -C finance-harness-be rev-parse 'HEAD^{tree}')" = "$FINANCE_BE_TREE_SHA"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: finance-harness-be/**/*.gradle*

      - name: Build pinned Finance BE
        working-directory: finance-harness-be
        run: ./gradlew --no-daemon bootJar

      - name: Run FE to BE Journal integration
        env:
          FINANCE_DB_URL: jdbc:postgresql://127.0.0.1:5432/finance_ci
          FINANCE_DB_USERNAME: finance_ci
          FINANCE_DB_PASSWORD: finance_ci_ephemeral
        run: |
          set -Eeuo pipefail
          BACKEND_JAR="$(find finance-harness-be/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$BACKEND_JAR"
          BACKEND_PIDS=()
          cleanup() {
            for pid in "${BACKEND_PIDS[@]}"; do
              kill "$pid" 2>/dev/null || true
            done
            for pid in "${BACKEND_PIDS[@]}"; do
              wait "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT
          start_backend() {
            local identity_user_id="$1"
            local port="$2"
            local log_file="$3"
            SPRING_PROFILES_ACTIVE=local \
            FINANCE_SERVICE_NAME="finance-harness-be-$identity_user_id" \
            FINANCE_LOCAL_IDENTITY_USER_ID="$identity_user_id" \
            FINANCE_DB_URL="$FINANCE_DB_URL" \
            FINANCE_DB_USERNAME="$FINANCE_DB_USERNAME" \
            FINANCE_DB_PASSWORD="$FINANCE_DB_PASSWORD" \
            FINANCE_DB_APPLICATION_NAME="finance-harness-be-$identity_user_id" \
            SERVER_PORT="$port" \
            SERVER_ADDRESS=127.0.0.1 \
              java -jar "$BACKEND_JAR" >"$log_file" 2>&1 &
            local pid="$!"
            BACKEND_PIDS+=("$pid")
            for attempt in $(seq 1 120); do
              if curl --fail --silent "http://127.0.0.1:$port/actuator/health/readiness" >/dev/null; then
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log_file"
                return 1
              fi
              sleep 2
            done
            cat "$log_file"
            return 1
          }
          start_backend rpl34-ci-user-a 8081 /tmp/rpl34-finance-be-a.log
          start_backend rpl34-ci-user-b 8082 /tmp/rpl34-finance-be-b.log
          pnpm exec playwright test --config=playwright.backend-integration.config.ts e2e/journal-backend.integration.spec.ts
