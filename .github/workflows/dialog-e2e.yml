name: Dialog harness e2e

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/dialog-e2e.yml
      - e2e/dialog-harness.spec.ts
      - e2e/support/dialog-harness/**
      - package.json
      - playwright.dialog-harness.config.ts
      - pnpm-lock.yaml
      - src/components/ui/**
      - src/styles/**
      - tsconfig*.json
      - vite.config.ts

permissions:
  contents: read

jobs:
  dialog-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Dialog browser tests
        run: pnpm run test:e2e:dialog
