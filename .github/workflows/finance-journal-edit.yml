name: Finance own-journal edit FE (proposed)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - codex/rpl34-finance-memory-reference-20261106
    paths:
      - .github/workflows/finance-journal-edit.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - vite.config.ts
      - src/app/AppRouter.tsx
      - src/constants/routes.ts
      - src/features/auth/financeReferenceAuth.ts
      - src/features/journal-edit/**
      - src/features/journal-read/**
      - src/i18n/**
      - src/pages/JournalDetailPage.tsx

permissions:
  contents: read

jobs:
  own-journal-edit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'rpl34/own-journal-edit-fe-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind verification to exact source
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          printf 'Verified source HEAD: %s\n' "$EVENT_HEAD_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck existing source
        run: pnpm exec tsc -b --noEmit
      - name: Run only Journal edit target
        run: >-
          pnpm exec vitest run
          src/features/journal-edit/journalEdit.test.tsx
          --reporter=default --reporter=junit
          --outputFile=journal-edit-junit.xml
      - name: Retain bounded test counts in job summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path("journal-edit-junit.xml")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if not p.exists():
                  summary.write("Journal edit JUnit: NOT_AVAILABLE (see failing step).\n")
              else:
                  root = ET.parse(p).getroot()
                  suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
                  counts = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
                  summary.write("Journal edit counts: " + str(counts) + "\n")
          PY
