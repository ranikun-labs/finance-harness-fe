name: RPL-34 Journal Create CI

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/rpl34-journal-create.yml
      - .node-version
      - .nvmrc
      - .prettierignore
      - e2e/journal-adaptive.spec.ts
      - e2e/support/**
      - eslint.config.js
      - index.html
      - package.json
      - playwright.config.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - prettier.config.js
      - scripts/**
      - src/**
      - tsconfig*.json
      - vite.config.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project verification
        run: pnpm run verify

      - name: Run deterministic Journal Create tests
        run: >-
          pnpm exec vitest run
          src/app/JournalCreateFlow.integration.test.tsx
          src/features/journal-new
          src/test/journal/DeterministicJournalCreatePort.test.ts
          src/pages/JournalNewPage.test.tsx

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Journal adaptive Playwright tests
        run: pnpm exec playwright test e2e/journal-adaptive.spec.ts
